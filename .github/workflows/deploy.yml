name: Build and Deploy to Plesk

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  # Never cancel a mid-flight FTP mirror — a cancelled mirror --delete can leave
  # production in a half-uploaded/half-deleted state (breakage investigation §6).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "jass-tour-ui-kit" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          REMOTE_ID=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "set net:timeout 30; set net:max-retries 2; set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; cat /Beize-Jass-Tour.mueller.ro/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "jass-tour-ui-kit" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'jass-tour-ui-kit'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy via FTP
        run: |
          n=0
          until [ $n -ge 4 ]; do
          OUT=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/ /Beize-Jass-Tour.mueller.ro/
          bye
          SCRIPT
          )
          RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && { echo "Deploy ok (attempt $((n+1)))"; break; }
          echo "$OUT" | grep -qiE '530|login (incorrect|failed)' && { echo "::error::FTP auth failed (530) — stale FTP secret, not transient; not retrying."; exit 1; }
          n=$((n+1)); [ $n -ge 4 ] && { echo "::error::Deploy failed after 4 attempts"; exit 1; }
          echo "::warning::attempt $n failed (transient); retrying in 25s..."; sleep 25
          done
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
