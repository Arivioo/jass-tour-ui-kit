name: Build and Deploy to Plesk

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true
        default: ''

concurrency:
  group: deploy-production
  # Never cancel a mid-flight FTP mirror - a cancelled mirror --delete can leave
  # production in a half-uploaded/half-deleted state (breakage investigation SS6).
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      # Public-safe Supabase client config (publishable key + public project URL -
      # these ship in every client bundle by design; RLS protects data).
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uyksotlmrlxhmyeopktl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: uyksotlmrlxhmyeopktl

  gate-security:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact --exit-code 1

      - name: 'Secret scan: full history (AUDIT only, non-blocking - historical keys are public/deprecated)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependency audit (blocking at critical)
        run: npm audit --audit-level=critical

      # SAST - code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [validate, gate-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          OUT=$(curl -sS --ssl-reqd --insecure --max-time 30 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Database changes ship WITH the release (2026-08-22, fleet drift fix — replyflow
      # pattern): applies every supabase/migrations file not yet in the ledger and fails
      # the deploy on error. Runs BEFORE the site ships so the frontend never goes live
      # ahead of the schema it expects.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref uyksotlmrlxhmyeopktl

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uyksotlmrlxhmyeopktl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: uyksotlmrlxhmyeopktl

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "jass-tour-ui-kit" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          REMOTE_ID=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "set net:timeout 30; set net:max-retries 2; set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; cat /Beize-Jass-Tour.mueller.ro/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "jass-tour-ui-kit" ]; then
            echo "::error::DEPLOY ABORTED - remote .site-id is '$REMOTE_ID', expected 'jass-tour-ui-kit'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy via FTP
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUT=$(lftp...) on the
          # first failure BEFORE this retry loop can iterate (dead-retry, deploy-standard SS3f).
          set +e
          n=0
          until [ $n -ge 4 ]; do
          OUT=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/ /Beize-Jass-Tour.mueller.ro/
          bye
          SCRIPT
          )
          RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && { echo "Deploy ok (attempt $((n+1)))"; break; }
          echo "$OUT" | grep -qiE '530|login (incorrect|failed)' && { echo "::error::FTP auth failed (530) - stale FTP secret, not transient; not retrying."; exit 1; }
          n=$((n+1)); [ $n -ge 4 ] && { echo "::error::Deploy failed after 4 attempts"; exit 1; }
          echo "::warning::attempt $n failed (transient); retrying in 25s..."; sleep 25
          done
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
